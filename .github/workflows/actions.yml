name: Scrape & Publish IMDb Data

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7.1.0

      - name: Setup Python environment
        uses: actions/setup-python@v7
        with:
          python-version: 3.14.8

      - name: Install obscura
        run: |
          curl -sL -o obscura.tar.gz "https://github.com/h4ckf0r0day/obscura/releases/download/v0.2.2/obscura-x86_64-linux-stealth.tar.gz"
          mkdir -p "$HOME/.local/obscura"
          tar xzf obscura.tar.gz -C "$HOME/.local/obscura"
          chmod +x "$HOME/.local/obscura/obscura" "$HOME/.local/obscura/obscura-worker"
          echo "$HOME/.local/obscura" >> "$GITHUB_PATH"
          rm obscura.tar.gz

      - name: Installing Dependencies
        run: |
          pip install --upgrade pipenv
          pipenv install

      - name: Generate
        run: |
          chmod +x ./generate.sh
          pipenv run ./generate.sh

      - name: Prettify files
        run: |
          npx prettier@3.5.3 --write .

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -z $(git status --porcelain) ]]; then
            echo "changes=false" >> $GITHUB_ENV
          else
            echo "changes=true" >> $GITHUB_ENV
          fi

      - name: Commit files
        if: ${{ env.changes == 'true' && github.ref == 'refs/heads/main' }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "Add changes"

      - name: Push changes
        if: ${{ env.changes == 'true' && github.ref == 'refs/heads/main' }}
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
